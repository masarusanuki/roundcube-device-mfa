# Roundcube 1.7 (RHEL/Rocky/Alma: Remi RPM, /usr/share/roundcubemail) behind Apache 2.4 + php-fpm
# Published at https://mail.example.org/roundcube/
# Requires: mod_ssl, mod_proxy_fcgi, mod_headers, mod_rewrite
#
# Important for Office 365 OAuth:
#   The OAuth redirect URI is .../index.php/login/oauth (PATH_INFO style),
#   so "AcceptPathInfo On" is set explicitly.
#
# Note: the RPM also ships /etc/httpd/conf.d/roundcubemail.conf (/roundcubemail, "Require local").
#       Use a different path, or edit that file instead of adding this one.

<VirtualHost *:80>
    ServerName mail.example.org
    Redirect permanent / https://mail.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName mail.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mail.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mail.example.org/privkey.pem

    Alias /roundcube /usr/share/roundcubemail/public_html

    <Directory /usr/share/roundcubemail/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        AcceptPathInfo On

        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
        </FilesMatch>

        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
    </Directory>

    # installer: local access only
    <Location /roundcube/installer.php>
        Require local
    </Location>
</VirtualHost>
