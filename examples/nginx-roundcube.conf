# Roundcube 1.7 (RHEL/Rocky/Alma: Remi RPM, /usr/share/roundcubemail) behind nginx + php-fpm
# Published at https://mail.example.org/roundcube/
#
# Important for Office 365 OAuth:
#   The OAuth redirect URI is .../index.php/login/oauth (PATH_INFO style),
#   so PHP must receive PATH_INFO. The "(.+?\.php)(/.*)?$" location below does that.

upstream php-fpm-roundcube {
    server unix:/run/php-fpm/www.sock;
}

server {
    listen 80;
    server_name mail.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.25.1+ may use "listen 443 ssl;" + "http2 on;"
    server_name mail.example.org;

    ssl_certificate     /etc/letsencrypt/live/mail.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.org/privkey.pem;

    client_max_body_size 30m;   # attachments

    location = /roundcube {
        return 301 /roundcube/;
    }

    location /roundcube/ {
        alias /usr/share/roundcubemail/public_html/;
        index index.php;
        try_files $uri $uri/ /roundcube/index.php$is_args$args;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # installer: local access only
        location ~ ^/roundcube/installer\.php$ {
            allow 127.0.0.1;
            allow ::1;
            deny all;

            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME /usr/share/roundcubemail/public_html/installer.php;
            fastcgi_pass   php-fpm-roundcube;
        }

        # index.php, static.php ... including PATH_INFO (index.php/login/oauth)
        location ~ ^/roundcube/(.+?\.php)(/.*)?$ {
            if (!-f /usr/share/roundcubemail/public_html/$1) { return 404; }

            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME /usr/share/roundcubemail/public_html/$1;
            fastcgi_param  PATH_INFO       $2;
            fastcgi_pass   php-fpm-roundcube;
        }
    }
}
